<style>
  /*
   * Set the saved colour before the main stylesheet is requested. This keeps
   * a dark viewport dark while the alternate theme stylesheet is loading.
   */
  html[data-color-theme="light"] {
    color-scheme: light;
  }

  html[data-color-theme="dark"],
  html[data-color-theme="dark"] body {
    background-color: #121212;
    color-scheme: dark;
  }
</style>

<script>
  (function () {
    var theme = 'light';

    try {
      var savedTheme = localStorage.getItem('color-theme');
      var prefersDark = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches;

      theme = savedTheme === 'dark' || savedTheme === 'light'
        ? savedTheme
        : (prefersDark ? 'dark' : 'light');
    } catch (error) {
      theme = 'light';
    }

    document.documentElement.setAttribute('data-color-theme', theme);

    try {
      if (localStorage.getItem('sidebar-collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-is-collapsed');
      }
    } catch (error) {
      /* Use the default expanded layout when storage is unavailable. */
    }
  })();
</script>
