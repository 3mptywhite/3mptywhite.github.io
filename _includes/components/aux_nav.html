<nav aria-label="Auxiliary" class="aux-nav">
  <ul class="aux-nav-list">
    {% for link in site.aux_links %}
      {% assign label = link.first %}
      <li class="aux-nav-list-item">
        <a
          href="{{ link.last }}"
          class="aux-icon-link"
          aria-label="{{ label }}"
          title="{{ label }}"
          {% if site.aux_links_new_tab %}
          target="_blank" rel="noopener noreferrer"
          {% endif %}
        >
          {% case label %}
            {% when "GitHub" %}
              <img src="https://cdn.simpleicons.org/github/8AA9D6" alt="" class="aux-icon">
            {% when "知乎" %}
              <img src="https://cdn.simpleicons.org/zhihu/8AA9D6" alt="" class="aux-icon aux-icon-wide">
            {% when "B站" %}
              <img src="https://cdn.simpleicons.org/bilibili/8AA9D6" alt="" class="aux-icon aux-icon-wide">
            {% else %}
              {{ label }}
          {% endcase %}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
