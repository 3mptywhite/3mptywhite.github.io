<nav aria-label="Auxiliary" class="aux-nav">
  <ul class="aux-nav-list">
    {% for link in site.aux_links %}
      {% assign label = link.first %}
      <li class="aux-nav-list-item">
        <a
          href="{{ link.last }}"
          class="site-button aux-icon-link"
          aria-label="{{ label }}"
          title="{{ label }}"
          {% if site.aux_links_new_tab %}
          target="_blank" rel="noopener noreferrer"
          {% endif %}
        >
          {% case label %}
            {% when "GitHub" %}
              <svg aria-hidden="true" viewBox="0 0 24 24" class="aux-icon">
                <path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17.6 4.8 18.6 5 18.6 5c.6 1.6.2 2.9.1 3.2.8.9 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"/>
              </svg>
            {% when "知乎" %}
              <svg aria-hidden="true" viewBox="0 0 24 24" class="aux-icon">
                <path d="M4 4h8v2H9.4c-.1 1-.2 1.9-.4 2.8h3.7v2H8.4l-.2.5 4.7 5.8-1.6 1.2-3.9-4.8A14.8 14.8 0 0 1 3.5 20L2 18.5A12.5 12.5 0 0 0 6.9 11H2.6V9h4.7c.2-1 .3-2 .4-3H4V4Zm10 1h8v14h-8V5Zm2 2v10h4V7h-4Z"/>
              </svg>
            {% when "B站" %}
              <svg aria-hidden="true" viewBox="0 0 24 24" class="aux-icon">
                <path d="M8.2 3.2 10 5h4l1.8-1.8 1.4 1.4L16.8 5H18a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h1.2L6.8 4.6l1.4-1.4ZM6 7a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1H6Zm4 3.6 4.6 2.4L10 15.4v-4.8Z"/>
              </svg>
            {% else %}
              {{ label }}
          {% endcase %}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
