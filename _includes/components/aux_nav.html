<nav aria-label="Auxiliary" class="aux-nav">
  <ul class="aux-nav-list">
    <li class="aux-nav-list-item">
      <button
        type="button"
        id="theme-toggle"
        class="theme-toggle btn-reset"
        aria-label="切换到深色模式"
        title="切换到深色模式"
      >
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
        </svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
        </svg>
      </button>
    </li>
    {% for link in site.aux_links %}
      {% assign label = link.first %}
      <li class="aux-nav-list-item">
        <a
          href="{{ link.last }}"
          class="aux-icon-link"
          aria-label="{{ label }}"
          title="{{ label }}"
          {% if site.aux_links_new_tab %}
          target="_blank" rel="noopener noreferrer"
          {% endif %}
        >
          {% case label %}
            {% when "GitHub" %}
              <img src="https://cdn.simpleicons.org/github/D1D5DB" alt="" class="aux-icon">
            {% when "知乎" %}
              <img src="https://cdn.simpleicons.org/zhihu/D1D5DB" alt="" class="aux-icon aux-icon-wide">
            {% when "B站" %}
              <img src="https://cdn.simpleicons.org/bilibili/D1D5DB" alt="" class="aux-icon aux-icon-wide">
            {% else %}
              {{ label }}
          {% endcase %}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
