<div id="main-header" class="main-header">
  <nav class="header-primary-nav" aria-label="站点页面">
    <a
      href="{{ '/posts/' | relative_url }}"
      class="header-primary-link{% if page.posts_page %} is-active{% endif %}"
      {% if page.posts_page %}aria-current="page"{% endif %}
    >Posts</a>
    <a
      href="{{ '/archive/' | relative_url }}"
      class="header-primary-link{% if page.archive_page %} is-active{% endif %}"
      {% if page.archive_page %}aria-current="page"{% endif %}
    >Archive</a>
    <a
      href="{{ '/' | relative_url }}"
      class="header-primary-link{% if page.about_page %} is-active{% endif %}"
      {% if page.about_page %}aria-current="page"{% endif %}
    >关于</a>
  </nav>
  {% include header_custom.html %}
  {% if site.aux_links %}
    {% include components/aux_nav.html %}
  {% endif %}
</div>
