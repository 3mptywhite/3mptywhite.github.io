<script>
  document.addEventListener('DOMContentLoaded', function () {
    var content = document.querySelector('.main-content') || document.body;
    var text = content ? content.textContent : '';
    var hasMath = /\\\(|\\\[|\$\$/.test(text);

    if (!hasMath) {
      return;
    }

    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      startup: {
        typeset: false,
        ready: function () {
          MathJax.startup.defaultReady();
          MathJax.typesetPromise();
        }
      }
    };

    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js';
    script.defer = true;
    document.head.appendChild(script);
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var blocks = Array.prototype.slice.call(
      document.querySelectorAll('pre > code.language-mermaid, code.language-mermaid')
    );

    if (!blocks.length) {
      return;
    }

    function renderMermaid() {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        securityLevel: 'strict'
      });

      blocks.forEach(function (block) {
        var source = block.textContent;
        var container = document.createElement('div');
        container.className = 'mermaid';
        container.textContent = source;

        var pre = block.closest('pre');
        var wrapper = pre && pre.parentElement && pre.parentElement.classList.contains('highlight')
          ? pre.parentElement.parentElement
          : pre;

        (wrapper || block).replaceWith(container);
      });

      mermaid.run();
    }

    if (window.mermaid) {
      renderMermaid();
      return;
    }

    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
    script.onload = renderMermaid;
    document.head.appendChild(script);
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var content = document.querySelector('.main-content');

    if (!content) {
      return;
    }

    var headings = Array.prototype.slice.call(content.querySelectorAll('h2, h3'))
      .filter(function (heading) {
        return heading.textContent.trim();
      });

    if (headings.length < 2 || content.querySelector('.article-outline')) {
      return;
    }

    var usedIds = {};

    function slugify(text) {
      var slug = text.trim().toLowerCase()
        .replace(/[^\w\u4e00-\u9fff-]+/g, '-')
        .replace(/^-+|-+$/g, '');

      return slug || 'section';
    }

    headings.forEach(function (heading) {
      if (!heading.id) {
        var baseId = slugify(heading.textContent);
        var id = baseId;
        var index = 2;

        while (document.getElementById(id) || usedIds[id]) {
          id = baseId + '-' + index;
          index += 1;
        }

        heading.id = id;
      }

      usedIds[heading.id] = true;
    });

    var outline = document.createElement('nav');
    outline.className = 'article-outline';
    outline.setAttribute('aria-label', '文章大纲');

    var pageTitle = content.querySelector('h1');
    var title = document.createElement('div');
    title.className = 'article-outline-title';
    title.textContent = pageTitle ? pageTitle.textContent.trim() : '本文目录';

    var list = document.createElement('ul');
    list.className = 'article-outline-list';

    headings.forEach(function (heading) {
      var item = document.createElement('li');
      item.className = 'article-outline-item article-outline-' + heading.tagName.toLowerCase();

      var link = document.createElement('a');
      link.href = '#' + heading.id;
      link.textContent = heading.textContent.trim();

      item.appendChild(link);
      list.appendChild(item);
    });

    outline.appendChild(title);
    outline.appendChild(list);

    if (pageTitle && content.contains(pageTitle)) {
      pageTitle.parentElement.insertBefore(outline, pageTitle.nextSibling);
    } else {
      content.insertBefore(outline, content.firstChild);
    }

    var links = Array.prototype.slice.call(outline.querySelectorAll('a'));

    if (!('IntersectionObserver' in window)) {
      return;
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) {
          return;
        }

        links.forEach(function (link) {
          link.classList.toggle('is-active', link.getAttribute('href') === '#' + entry.target.id);
        });
      });
    }, {
      rootMargin: '-18% 0px -68% 0px',
      threshold: 0
    });

    headings.forEach(function (heading) {
      observer.observe(heading);
    });
  });
</script>
