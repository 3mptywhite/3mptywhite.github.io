<script>
  (function () {
    var theme = 'light';
    var themeAssetVersion = '{{ site.time | date: "%s" }}';

    window.applySiteTheme = function (nextTheme) {
      if (!window.jtd || typeof window.jtd.setTheme !== 'function') {
        return;
      }

      window.jtd.setTheme(nextTheme === 'dark' ? 'custom-dark' : 'custom');

      var stylesheet = document.querySelector('link[rel="stylesheet"]');

      if (stylesheet) {
        var stylesheetPath = stylesheet.getAttribute('href').split('?')[0];
        stylesheet.setAttribute('href', stylesheetPath + '?v=' + themeAssetVersion);
      }
    };

    try {
      var savedTheme = localStorage.getItem('color-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      theme = savedTheme === 'dark' || savedTheme === 'light'
        ? savedTheme
        : (prefersDark ? 'dark' : 'light');
    } catch (error) {
      theme = 'light';
    }

    document.documentElement.setAttribute('data-color-theme', theme);

    window.applySiteTheme(theme);

    try {
      if (localStorage.getItem('sidebar-collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-is-collapsed');
      }
    } catch (error) {
      /* Use the default expanded layout when storage is unavailable. */
    }
  })();
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var toggle = document.getElementById('theme-toggle');

    if (!toggle) {
      return;
    }

    function updateToggle(theme) {
      var label = theme === 'dark' ? '切换到浅色模式' : '切换到深色模式';
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('title', label);
    }

    var currentTheme = document.documentElement.getAttribute('data-color-theme') || 'light';
    updateToggle(currentTheme);

    toggle.addEventListener('click', function () {
      var nextTheme = document.documentElement.getAttribute('data-color-theme') === 'dark'
        ? 'light'
        : 'dark';

      document.documentElement.setAttribute('data-color-theme', nextTheme);
      window.applySiteTheme(nextTheme);

      try {
        localStorage.setItem('color-theme', nextTheme);
      } catch (error) {
        /* The selected theme still applies for the current page. */
      }

      updateToggle(nextTheme);
    });
  });
</script>

</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var blocks = Array.prototype.slice.call(
      document.querySelectorAll('pre > code.language-mermaid, code.language-mermaid')
    );

    if (!blocks.length) {
      return;
    }

    function renderMermaid() {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        securityLevel: 'strict'
      });

      blocks.forEach(function (block) {
        var source = block.textContent;
        var container = document.createElement('div');
        container.className = 'mermaid';
        container.textContent = source;

        var pre = block.closest('pre');
        var wrapper = pre && pre.parentElement && pre.parentElement.classList.contains('highlight')
          ? pre.parentElement.parentElement
          : pre;

        (wrapper || block).replaceWith(container);
      });

      mermaid.run();
    }

    if (window.mermaid) {
      renderMermaid();
      return;
    }

    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
    script.onload = renderMermaid;
    document.head.appendChild(script);
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var content = document.querySelector('.main-content');

    if (!content) {
      return;
    }

    var headings = Array.prototype.slice.call(content.querySelectorAll('h2, h3'))
      .filter(function (heading) {
        return heading.textContent.trim();
      });

    if (headings.length < 2 || content.querySelector('.article-outline')) {
      return;
    }

    var usedIds = {};

    function slugify(text) {
      var slug = text.trim().toLowerCase()
        .replace(/[^\w\u4e00-\u9fff-]+/g, '-')
        .replace(/^-+|-+$/g, '');

      return slug || 'section';
    }

    headings.forEach(function (heading) {
      if (!heading.id) {
        var baseId = slugify(heading.textContent);
        var id = baseId;
        var index = 2;

        while (document.getElementById(id) || usedIds[id]) {
          id = baseId + '-' + index;
          index += 1;
        }

        heading.id = id;
      }

      usedIds[heading.id] = true;
    });

    var outline = document.createElement('nav');
    outline.className = 'article-outline';
    outline.setAttribute('aria-label', '文章大纲');

    var pageTitle = content.querySelector('h1');
    var title = document.createElement('div');
    title.className = 'article-outline-title';
    title.textContent = pageTitle ? pageTitle.textContent.trim() : '本文目录';

    var list = document.createElement('ul');
    list.className = 'article-outline-list';

    headings.forEach(function (heading) {
      var item = document.createElement('li');
      item.className = 'article-outline-item article-outline-' + heading.tagName.toLowerCase();

      var link = document.createElement('a');
      link.href = '#' + heading.id;

      var label = document.createElement('span');
      label.className = 'article-outline-link-label';
      label.textContent = heading.textContent.trim();

      link.appendChild(label);
      item.appendChild(link);
      list.appendChild(item);
    });

    outline.appendChild(title);
    outline.appendChild(list);

    if (pageTitle && content.contains(pageTitle)) {
      pageTitle.parentElement.insertBefore(outline, pageTitle.nextSibling);
    } else {
      content.insertBefore(outline, content.firstChild);
    }

    var links = Array.prototype.slice.call(outline.querySelectorAll('a'));

    if (!('IntersectionObserver' in window)) {
      return;
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) {
          return;
        }

        links.forEach(function (link) {
          link.classList.toggle('is-active', link.getAttribute('href') === '#' + entry.target.id);
        });
      });
    }, {
      rootMargin: '-18% 0px -68% 0px',
      threshold: 0
    });

    headings.forEach(function (heading) {
      observer.observe(heading);
    });
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var sideBar = document.querySelector('.side-bar');

    if (!sideBar) {
      return;
    }

    var storageKey = 'sidebar-collapsed';
    var root = document.documentElement;
    var toggle = document.createElement('button');

    if (!sideBar.id) {
      sideBar.id = 'site-sidebar';
    }

    toggle.type = 'button';
    toggle.className = 'sidebar-collapse-toggle';
    toggle.setAttribute('aria-controls', sideBar.id);
    toggle.innerHTML = '<span aria-hidden="true"></span>';
    document.body.appendChild(toggle);

    function isCollapsed() {
      return root.classList.contains('sidebar-is-collapsed');
    }

    function updateToggle() {
      var collapsed = isCollapsed();
      var label = collapsed ? '展开左侧导航' : '收起左侧导航';

      toggle.setAttribute('aria-expanded', String(!collapsed));
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('title', label);
    }

    function setCollapsed(collapsed, savePreference) {
      root.classList.toggle('sidebar-is-collapsed', collapsed);
      updateToggle();

      if (!savePreference) {
        return;
      }

      try {
        localStorage.setItem(storageKey, collapsed ? 'true' : 'false');
      } catch (error) {
        /* The selected layout still applies for the current page. */
      }
    }

    try {
      setCollapsed(localStorage.getItem(storageKey) === 'true', false);
    } catch (error) {
      updateToggle();
    }

    toggle.addEventListener('click', function () {
      setCollapsed(!isCollapsed(), true);
    });
  });
</script>
