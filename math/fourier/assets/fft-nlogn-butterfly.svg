<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <rect width="1600" height="1060" fill="#ffffff"/>

  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 19px; fill: #374151; }
    .stageTitle { font-size: 18px; font-weight: 700; fill: #1d4ed8; }
    .label { font-size: 17px; fill: #111827; }
    .small { font-size: 14px; fill: #374151; }
    .tiny { font-size: 12px; fill: #4b5563; }
    .math { font-size: 18px; fill: #111827; }
    .formula { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .twText { font-size: 18px; fill: #1d4ed8; font-weight: 700; }
    .minus { font-size: 24px; fill: #b91c1c; font-weight: 700; }
    .plus { font-size: 20px; fill: #111827; font-weight: 700; }
    .node { fill: #ffffff; stroke: #111827; stroke-width: 2; }
    .line { stroke: #111827; stroke-width: 2.2; fill: none; }
    .diag { stroke: #111827; stroke-width: 2.2; fill: none; }
    .stageBox { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.8; stroke-dasharray: 7 7; opacity: 0.45; }
    .noteBox { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.8; rx: 8; }
    .labelBg { fill: #ffffff; stroke: none; }
  </style>

  <text x="60" y="55" class="title">N=8 FFT 递归蝶形图</text>
  <text x="60" y="88" class="subtitle">从 1 点 DFT 逐层合并成 2 点、4 点、8 点 DFT；中间 3 个合并层对应 log₂8=3</text>

  <rect x="60" y="116" width="540" height="96" class="noteBox"/>
  <text x="84" y="151" class="math">X[k] = X_e[k] + W_N^k X_o[k]</text>
  <text x="84" y="185" class="math">X[k + N/2] = X_e[k] - W_N^k X_o[k]</text>
  <text x="630" y="151" class="small">每个蝶形：上端输出用加号，下端输出用减号</text>
  <text x="630" y="185" class="small">奇分支进入合并前乘单位圆旋转因子 W_N^k</text>

  <!-- Main columns -->
  <rect x="215" y="250" width="320" height="715" class="stageBox"/>
  <rect x="500" y="250" width="425" height="715" class="stageBox"/>
  <rect x="890" y="250" width="440" height="715" class="stageBox"/>
  <text x="322" y="239" class="stageTitle">合并层 1：2 点 DFT</text>
  <text x="695" y="239" class="stageTitle">合并层 2：4 点 DFT</text>
  <text x="1090" y="239" class="stageTitle">合并层 3：8 点 DFT</text>

  <!-- y lanes -->
  <!-- 300, 390, 480, 570, 660, 750, 840, 930 -->

  <!-- Leaf labels, placed away from wires -->
  <text x="48" y="295" class="label">X_eee[0]</text><text x="150" y="295" class="tiny">= x[0]</text>
  <text x="48" y="385" class="label">X_eeo[0]</text><text x="150" y="385" class="tiny">= x[4]</text>
  <text x="48" y="475" class="label">X_eoe[0]</text><text x="150" y="475" class="tiny">= x[2]</text>
  <text x="48" y="565" class="label">X_eoo[0]</text><text x="150" y="565" class="tiny">= x[6]</text>
  <text x="48" y="655" class="label">X_oee[0]</text><text x="150" y="655" class="tiny">= x[1]</text>
  <text x="48" y="745" class="label">X_oeo[0]</text><text x="150" y="745" class="tiny">= x[5]</text>
  <text x="48" y="835" class="label">X_ooe[0]</text><text x="150" y="835" class="tiny">= x[3]</text>
  <text x="48" y="925" class="label">X_ooo[0]</text><text x="150" y="925" class="tiny">= x[7]</text>

  <text x="1390" y="305" class="label">X[0]</text>
  <text x="1390" y="395" class="label">X[1]</text>
  <text x="1390" y="485" class="label">X[2]</text>
  <text x="1390" y="575" class="label">X[3]</text>
  <text x="1390" y="665" class="label">X[4]</text>
  <text x="1390" y="755" class="label">X[5]</text>
  <text x="1390" y="845" class="label">X[6]</text>
  <text x="1390" y="935" class="label">X[7]</text>

  <!-- Nodes -->
  <g>
    <circle cx="230" cy="300" r="7" class="node"/><circle cx="230" cy="390" r="7" class="node"/>
    <circle cx="230" cy="480" r="7" class="node"/><circle cx="230" cy="570" r="7" class="node"/>
    <circle cx="230" cy="660" r="7" class="node"/><circle cx="230" cy="750" r="7" class="node"/>
    <circle cx="230" cy="840" r="7" class="node"/><circle cx="230" cy="930" r="7" class="node"/>

    <circle cx="510" cy="300" r="7" class="node"/><circle cx="510" cy="390" r="7" class="node"/>
    <circle cx="510" cy="480" r="7" class="node"/><circle cx="510" cy="570" r="7" class="node"/>
    <circle cx="510" cy="660" r="7" class="node"/><circle cx="510" cy="750" r="7" class="node"/>
    <circle cx="510" cy="840" r="7" class="node"/><circle cx="510" cy="930" r="7" class="node"/>

    <circle cx="900" cy="300" r="7" class="node"/><circle cx="900" cy="390" r="7" class="node"/>
    <circle cx="900" cy="480" r="7" class="node"/><circle cx="900" cy="570" r="7" class="node"/>
    <circle cx="900" cy="660" r="7" class="node"/><circle cx="900" cy="750" r="7" class="node"/>
    <circle cx="900" cy="840" r="7" class="node"/><circle cx="900" cy="930" r="7" class="node"/>

    <circle cx="1310" cy="300" r="7" class="node"/><circle cx="1310" cy="390" r="7" class="node"/>
    <circle cx="1310" cy="480" r="7" class="node"/><circle cx="1310" cy="570" r="7" class="node"/>
    <circle cx="1310" cy="660" r="7" class="node"/><circle cx="1310" cy="750" r="7" class="node"/>
    <circle cx="1310" cy="840" r="7" class="node"/><circle cx="1310" cy="930" r="7" class="node"/>
  </g>

  <!-- Stage 1 butterflies: endpoints inset to leave text room -->
  <g>
    <path d="M237 300 H503" class="line"/><path d="M237 390 H503" class="line"/>
    <path d="M300 300 L440 390" class="diag"/><path d="M300 390 L440 300" class="diag"/>
    <text x="270" y="367" class="twText">W₂⁰</text><text x="482" y="294" class="plus">+</text><text x="482" y="386" class="minus">−</text>

    <path d="M237 480 H503" class="line"/><path d="M237 570 H503" class="line"/>
    <path d="M300 480 L440 570" class="diag"/><path d="M300 570 L440 480" class="diag"/>
    <text x="270" y="547" class="twText">W₂⁰</text><text x="482" y="474" class="plus">+</text><text x="482" y="566" class="minus">−</text>

    <path d="M237 660 H503" class="line"/><path d="M237 750 H503" class="line"/>
    <path d="M300 660 L440 750" class="diag"/><path d="M300 750 L440 660" class="diag"/>
    <text x="270" y="727" class="twText">W₂⁰</text><text x="482" y="654" class="plus">+</text><text x="482" y="746" class="minus">−</text>

    <path d="M237 840 H503" class="line"/><path d="M237 930 H503" class="line"/>
    <path d="M300 840 L440 930" class="diag"/><path d="M300 930 L440 840" class="diag"/>
    <text x="270" y="907" class="twText">W₂⁰</text><text x="482" y="834" class="plus">+</text><text x="482" y="926" class="minus">−</text>
  </g>

  <!-- Stage 2 butterflies -->
  <g>
    <path d="M517 300 H893" class="line"/><path d="M517 480 H893" class="line"/>
    <path d="M625 300 L790 480" class="diag"/><path d="M625 480 L790 300" class="diag"/>
    <text x="570" y="445" class="twText">W₄⁰</text><text x="878" y="294" class="plus">+</text><text x="878" y="476" class="minus">−</text>

    <path d="M517 390 H893" class="line"/><path d="M517 570 H893" class="line"/>
    <path d="M625 390 L790 570" class="diag"/><path d="M625 570 L790 390" class="diag"/>
    <text x="570" y="535" class="twText">W₄¹</text><text x="878" y="384" class="plus">+</text><text x="878" y="566" class="minus">−</text>

    <path d="M517 660 H893" class="line"/><path d="M517 840 H893" class="line"/>
    <path d="M625 660 L790 840" class="diag"/><path d="M625 840 L790 660" class="diag"/>
    <text x="570" y="805" class="twText">W₄⁰</text><text x="878" y="654" class="plus">+</text><text x="878" y="836" class="minus">−</text>

    <path d="M517 750 H893" class="line"/><path d="M517 930 H893" class="line"/>
    <path d="M625 750 L790 930" class="diag"/><path d="M625 930 L790 750" class="diag"/>
    <text x="570" y="895" class="twText">W₄¹</text><text x="878" y="744" class="plus">+</text><text x="878" y="926" class="minus">−</text>
  </g>

  <!-- Stage 3 butterflies -->
  <g>
    <path d="M907 300 H1303" class="line"/><path d="M907 660 H1303" class="line"/>
    <path d="M1045 300 L1190 660" class="diag"/><path d="M1045 660 L1190 300" class="diag"/>
    <text x="965" y="615" class="twText">W₈⁰</text><text x="1285" y="294" class="plus">+</text><text x="1285" y="656" class="minus">−</text>

    <path d="M907 390 H1303" class="line"/><path d="M907 750 H1303" class="line"/>
    <path d="M1045 390 L1190 750" class="diag"/><path d="M1045 750 L1190 390" class="diag"/>
    <text x="965" y="705" class="twText">W₈¹</text><text x="1285" y="384" class="plus">+</text><text x="1285" y="746" class="minus">−</text>

    <path d="M907 480 H1303" class="line"/><path d="M907 840 H1303" class="line"/>
    <path d="M1045 480 L1190 840" class="diag"/><path d="M1045 840 L1190 480" class="diag"/>
    <text x="965" y="795" class="twText">W₈²</text><text x="1285" y="474" class="plus">+</text><text x="1285" y="836" class="minus">−</text>

    <path d="M907 570 H1303" class="line"/><path d="M907 930 H1303" class="line"/>
    <path d="M1045 570 L1190 930" class="diag"/><path d="M1045 930 L1190 570" class="diag"/>
    <text x="965" y="885" class="twText">W₈³</text><text x="1285" y="564" class="plus">+</text><text x="1285" y="926" class="minus">−</text>
  </g>

  <!-- Intermediate labels are drawn last with white backgrounds so wires never cover them. -->
  <g>
    <rect x="524" y="274" width="78" height="23" class="labelBg"/><text x="530" y="292" class="label">X_ee[0]</text>
    <rect x="524" y="394" width="78" height="23" class="labelBg"/><text x="530" y="412" class="label">X_ee[1]</text>
    <rect x="524" y="454" width="78" height="23" class="labelBg"/><text x="530" y="472" class="label">X_eo[0]</text>
    <rect x="524" y="574" width="78" height="23" class="labelBg"/><text x="530" y="592" class="label">X_eo[1]</text>
    <rect x="524" y="634" width="78" height="23" class="labelBg"/><text x="530" y="652" class="label">X_oe[0]</text>
    <rect x="524" y="754" width="78" height="23" class="labelBg"/><text x="530" y="772" class="label">X_oe[1]</text>
    <rect x="524" y="814" width="78" height="23" class="labelBg"/><text x="530" y="832" class="label">X_oo[0]</text>
    <rect x="524" y="934" width="78" height="23" class="labelBg"/><text x="530" y="952" class="label">X_oo[1]</text>

    <rect x="914" y="274" width="70" height="23" class="labelBg"/><text x="920" y="292" class="label">X_e[0]</text>
    <rect x="914" y="394" width="70" height="23" class="labelBg"/><text x="920" y="412" class="label">X_e[1]</text>
    <rect x="914" y="454" width="70" height="23" class="labelBg"/><text x="920" y="472" class="label">X_e[2]</text>
    <rect x="914" y="574" width="70" height="23" class="labelBg"/><text x="920" y="592" class="label">X_e[3]</text>
    <rect x="914" y="634" width="70" height="23" class="labelBg"/><text x="920" y="652" class="label">X_o[0]</text>
    <rect x="914" y="754" width="70" height="23" class="labelBg"/><text x="920" y="772" class="label">X_o[1]</text>
    <rect x="914" y="814" width="70" height="23" class="labelBg"/><text x="920" y="832" class="label">X_o[2]</text>
    <rect x="914" y="934" width="70" height="23" class="labelBg"/><text x="920" y="952" class="label">X_o[3]</text>
  </g>

  <rect x="60" y="985" width="1480" height="44" class="noteBox"/>
  <text x="85" y="1013" class="formula">复杂度：每个合并层有 N/2 个蝶形，每个蝶形常数次运算，所以每层 O(N)；合并层数为 log₂N，因此总复杂度为 O(Nlog₂N)。</text>
</svg>
