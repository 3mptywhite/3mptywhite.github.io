title: Frank 的笔记本
description: 个人笔记与博客
author: Frank
url: "https://frankhumingtao.github.io"
baseurl: ""

remote_theme: sighingnow/jekyll-gitbook

# 目录 (TOC)
toc:
  enabled: true
  h_min: 1
  h_max: 3

# Markdown 渲染
markdown: kramdown
kramdown:
  auto_ids: true
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    guess_lang: true

syntax_highlighter_style: colorful

# 固定链接
permalink: /posts/:year-:month-:day-:title/

# 集合
collections:
  pages:
    output: true
    sort_by: date
    permalink: /:collection/:path/
  others:
    output: true
    sort_by: date
    permalink: /:collection/:path/

ordered_collections:
  - posts
  - pages
  - others

page_width: 800px

destination: ./_site
incremental: false
regenerate: true

plugins:
  - jekyll-feed
  - jekyll-readme-index
  - jemoji

exclude:
  - _drafts
  - Gemfile
  - Gemfile.lock
  - README.md

timezone: Asia/Shanghai
