<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" font-family="Segoe UI, Microsoft YaHei, sans-serif">
<rect width="1200" height="510" fill="#090b0e"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#737d8a" stroke-width="1.6"/></marker></defs>
<text x="36" y="48" font-size="27" fill="#f2f4f7">参数传递：灯光角度与 K，分两路进入 Shader</text>
<g font-size="19" fill="#aab3c0"><text x="36" y="94">编辑器 / 游戏侧</text><text x="324" y="94">CPU 准备数据</text><text x="634" y="94">传入 GPU 的参数</text><text x="993" y="94">灯光 Shader</text></g>
<g fill="#11151b" stroke="#343b45"><rect x="36" y="126" width="242" height="144"/><rect x="324" y="126" width="264" height="144"/><rect x="634" y="126" width="310" height="144"/><rect x="36" y="330" width="242" height="100"/><rect x="324" y="330" width="264" height="100"/><rect x="634" y="330" width="310" height="100"/><rect x="993" y="210" width="174" height="144"/></g>
<g fill="#f2f4f7" font-size="20"><text x="54" y="159">SpotLight 组件</text><text x="54" y="195">Inner / Outer</text><text x="54" y="231" fill="#76b5ff">新增 Mid</text><text x="342" y="159">SceneProxy</text><text x="342" y="195">角度 → 余弦值</text><text x="342" y="231">计算余弦差的倒数</text><text x="652" y="159">原有角度参数</text><text x="652" y="195" font-size="17">LightSourceRadiusAndLength</text><text x="652" y="231" fill="#76b5ff">z、w：新增 Mid 的两个数值</text><text x="54" y="366">后处理设置</text><text x="54" y="403" fill="#76b5ff">K：宽分量权重</text><text x="342" y="366">最终后处理设置</text><text x="342" y="403">写入 View 统一参数</text><text x="652" y="366" fill="#76b5ff">View.</text><text x="652" y="403" font-size="19" fill="#76b5ff">SpotlightDualAttenuationK</text><text x="1011" y="247">读取角度和 K</text><text x="1011" y="285">计算双锥衰减</text><text x="1011" y="323">继续计算照明</text></g>
<g fill="none" stroke="#737d8a" stroke-width="2" marker-end="url(#arrow)"><path d="M278 198 H313"/><path d="M588 198 H623"/><path d="M278 380 H313"/><path d="M588 380 H623"/><path d="M944 198 H966 V247 H984"/><path d="M944 380 H966 V319 H984"/></g>
<text x="36" y="481" font-size="19" fill="#aab3c0">Mid 随灯传递，可以逐灯调整；K 随视图传递，当前实现由采用该逻辑的灯共享。</text>
</svg>
